<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #F9FBF9; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #2D3748;">
    <!-- 顶部标题区 -->
    <g transform="translate(30, 40)">
        <text x="0" y="5" font-size="18" font-weight="600" letter-spacing="0.5" fill="#1A202C">阳马空间折线最值模型 (双重翻折法)</text>
        <text x="0" y="24" font-size="12" fill="#718096">《九章算术》商功：底面为矩形，一棱垂直于底面的四棱锥</text>
        <line x1="0" y1="35" x2="940" y2="35" stroke="#E2E8F0" stroke-width="1"/>
    </g>

    <!-- 左侧：3D透视及翻折过程 -->
    <g transform="translate(30, 110)">
        <rect width="450" height="340" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="1.2"/>
        <text x="15" y="25" font-size="12" font-weight="600" fill="#718096">3D 空间翻折示意 (展开进度: 60%)</text>
        
        <!-- 3D 几何体绘制 -->
        <g transform="translate(180, 180)">
            <!-- 翻折辅助面与弧线指示 -->
            <!-- PAB 翻折路径 -->
            <path d="M -80,-80 A 113 113 0 0 1 -113,0" fill="none" stroke="#3182CE" stroke-width="1" stroke-dasharray="3,3"/>
            <polygon points="-113,0 0,0 -80,-80" fill="#3182CE" fill-opacity="0.05"/>
            <path d="M -105,-5 L -113,0 L -110,-10" fill="none" stroke="#3182CE" stroke-width="1"/>

            <!-- 底面 ABCD (透视投影) -->
            <!-- A(0,0,0)->(0,0), B(2,0,0)->(-80,0), C(2,2,0)->(40,80), D(0,2,0)->(120,80) -->
            <polygon points="0,0 -80,0 40,80 120,80" fill="#EDF2F7" fill-opacity="0.6" stroke="#4A5568" stroke-width="1.2"/>
            
            <!-- 垂直棱 PA (A为0,0, P为0,-100) -->
            <line x1="0" y1="0" x2="0" y2="-100" stroke="#4A5568" stroke-width="1.2" stroke-dasharray="4,3"/>
            
            <!-- 阳马其它可见棱 -->
            <line x1="0" y1="-100" x2="-80" y2="0" stroke="#4A5568" stroke-width="1.5"/>
            <line x1="0" y1="-100" x2="120" y2="80" stroke="#4A5568" stroke-width="1.5"/>
            <line x1="0" y1="-100" x2="40" y2="80" stroke="#4A5568" stroke-width="1"/>

            <!-- 翻折后的虚拟点 P' (处于底面平面的左侧延长线) -->
            <line x1="0" y1="0" x2="-113" y2="0" stroke="#3182CE" stroke-width="1" stroke-dasharray="4,3"/>
            <circle cx="-113" cy="0" r="3" fill="#3182CE"/>
            <text x="-135" y="4" font-size="11" fill="#3182CE" font-weight="600">P'</text>
            <line x1="-113" y1="0" x2="-50" y2="0" stroke="#E53E3E" stroke-width="1.5" stroke-dasharray="3,2"/>

            <!-- 动点 E (在 AB 上), F (在 BC 上) -->
            <!-- AB段为 (0,0) 到 (-80,0), 取 E 位于 (-50,0) -->
            <!-- BC段为 (-80,0) 到 (40,80), 取 F 位于 (-20,40) -->
            <circle cx="-50" cy="0" r="3.5" fill="#E53E3E"/>
            <text x="-55" y="-10" font-size="11" fill="#E53E3E" font-weight="600">E</text>

            <circle cx="-20" cy="40" r="3.5" fill="#E53E3E"/>
            <text x="-15" y="48" font-size="11" fill="#E53E3E" font-weight="600">F</text>

            <!-- 空间折线段 PE, EF, FD -->
            <!-- 此时 PE 已随 PAB 翻折了部分角度，这里绘制半展开状态下的折线连接 -->
            <line x1="0" y1="-100" x2="-50" y2="0" stroke="#E53E3E" stroke-width="1.8"/> <!-- PE (未完全展开) -->
            <line x1="-50" y1="0" x2="-20" y2="40" stroke="#E53E3E" stroke-width="1.8"/> <!-- EF -->
            <line x1="-20" y1="40" x2="120" y2="80" stroke="#E53E3E" stroke-width="1.8"/> <!-- FD -->
            
            <!-- 定长边 PD (不可见，用虚线) -->
            <line x1="0" y1="-100" x2="120" y2="80" stroke="#718096" stroke-width="1" stroke-dasharray="3,3"/>

            <!-- 顶点标签 -->
            <text x="-5" y="-108" font-size="12" font-weight="600">P</text>
            <text x="10" y="12" font-size="12">A</text>
            <text x="-95" y="5" font-size="12">B</text>
            <text x="35" y="95" font-size="12">C</text>
            <text x="130" y="85" font-size="12">D</text>
            
            <!-- 长度标注 -->
            <text x="65" y="95" font-size="11" fill="#718096">2</text>
            <text x="-45" y="15" font-size="11" fill="#718096">2</text>
            <text x="15" y="-50" font-size="11" fill="#718096">1</text>
        </g>
    </g>

    <!-- 右上：2D 平面展平分析 -->
    <g transform="translate(510, 110)">
        <rect width="460" height="230" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="1.2"/>
        <text x="15" y="25" font-size="12" font-weight="600" fill="#718096">2D 展开坐标系分析 (完全展平状态)</text>
        
        <!-- 网格与坐标轴 -->
        <g transform="translate(160, 120) scale(40, -40)"> 
            <!-- 缩放尺度：1单位 = 40px, Y轴向上为正 -->
            <!-- 辅助网格 -->
            <path d="M -2,-2 L 3,-2 M -2,-1 L 3,-1 M -2,1 L 3,1 M -2,2 L 3,2 M -2,3 L 3,3" stroke="#EDF2F7" stroke-width="0.02"/>
            <path d="M -1,-2 L -1,3 M 1,-2 L 1,3 M 2,-2 L 2,3" stroke="#EDF2F7" stroke-width="0.02"/>
            
            <!-- 坐标轴 -->
            <line x1="-2" y1="0" x2="3.2" y2="0" stroke="#CBD5E0" stroke-width="0.03"/> <!-- x轴 (BC所在直线) -->
            <line x1="0" y1="-2.2" x2="0" y2="3.2" stroke="#CBD5E0" stroke-width="0.03"/> <!-- y轴 (AB所在直线) -->

            <!-- 关键点与折线 -->
            <!-- P' = (-1, 2) -->
            <!-- D' = (2, -2) 为 D(2,2) 关于 x轴的对称点 -->
            <!-- 连接 P'D' 穿过 y轴于 E(0, 0.67), 穿过 x轴于 F(1, 0) -->
            <line x1="-1" y1="2" x2="2" y2="-2" stroke="#E53E3E" stroke-width="0.06"/>
            
            <!-- 矩形区域 ABCD 边界 -->
            <rect x="0" y="0" width="2" height="2" fill="none" stroke="#718096" stroke-width="0.03" stroke-dasharray="0.1, 0.05"/>

            <!-- 点标记 -->
            <circle cx="-1" cy="2" r="0.08" fill="#3182CE"/>
            <circle cx="2" cy="-2" r="0.08" fill="#3182CE"/>
            <circle cx="0" cy="2" r="0.06" fill="#4A5568"/>
            <circle cx="0" cy="0" r="0.06" fill="#4A5568"/>
            <circle cx="2" cy="0" r="0.06" fill="#4A5568"/>
            <circle cx="2" cy="2" r="0.06" fill="#4A5568"/>
            <circle cx="0" cy="0.67" r="0.07" fill="#E53E3E"/>
            <circle cx="1" cy="0" r="0.07" fill="#E53E3E"/>
        </g>

        <!-- 2D 文本标签标注 (防止缩放变形，在外部绘制) -->
        <g transform="translate(160, 120)">
            <!-- 坐标原点 B -->
            <text x="-15" y="15" font-size="11" fill="#4A5568">B(0,0)</text>
            <!-- A 点 -->
            <text x="-15" y="-85" font-size="11" fill="#4A5568">A(0,2)</text>
            <!-- C 点 -->
            <text x="85" y="15" font-size="11" fill="#4A5568">C(2,0)</text>
            <!-- D 点 -->
            <text x="85" y="-85" font-size="11" fill="#718096">D(2,2)</text>
            <!-- P' 点 -->
            <text x="-70" y="-85" font-size="11" fill="#3182CE" font-weight="600">P'(-1,2)</text>
            <!-- D' 点 -->
            <text x="95" y="95" font-size="11" fill="#3182CE" font-weight="600">D'(2,-2)</text>
            <!-- 交叉点 E -->
            <text x="8" y="-22" font-size="11" fill="#E53E3E" font-weight="600">E(0, 2/3)</text>
            <!-- 交叉点 F -->
            <text x="45" y="15" font-size="11" fill="#E53E3E" font-weight="600">F(1,0)</text>
            
            <!-- 勾股定理三角形辅助线 -->
            <line x1="-40" y1="-80" x2="80" y2="80" stroke="#718096" stroke-width="1" stroke-dasharray="2,2"/>
            <path d="M -40,-80 L 80,-80 L 80,80 Z" fill="none" stroke="#3182CE" stroke-width="1" stroke-dasharray="3,3"/>
            <text x="20" y="-90" font-size="11" fill="#3182CE">Δx = 3</text>
            <text x="90" y="5" font-size="11" fill="#3182CE">Δy = 4</text>
        </g>
    </g>

    <!-- 右下：定量计算与推导 -->
    <g transform="translate(510, 355)">
        <rect width="460" height="95" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="1.2"/>
        <text x="15" y="22" font-size="12" font-weight="600" fill="#718096">数学推导与证明</text>
        
        <g transform="translate(20, 42)">
            <!-- 公式推导 -->
            <text x="0" y="10" font-size="12" fill="#2D3748">
                空间周长 <tspan font-weight="600">L = PE + EF + FD + PD</tspan>
            </text>
            <text x="0" y="30" font-size="12" fill="#2D3748">
                定长边 <tspan fill="#4A5568">PD = √(PA² + AD²) = √(1² + 2²) = √5</tspan>
            </text>
            <text x="0" y="50" font-size="12" fill="#2D3748">
                折线段最值 <tspan fill="#E53E3E" font-weight="600">(PE + EF + FD)min = P'D' = √(3² + 4²) = 5</tspan>
            </text>
            
            <!-- 最终结论高亮包围框 -->
            <rect x="290" y="-5" width="130" height="60" fill="#FFF5F5" rx="4" stroke="#FEB2B2" stroke-width="1"/>
            <text x="355" y="20" font-size="11" fill="#C53030" text-anchor="middle">最小周长</text>
            <text x="355" y="42" font-size="16" font-weight="700" fill="#9B2C2C" text-anchor="middle">5 + √5</text>
        </g>
    </g>

    <!-- 底部：交互控制台 -->
    <g transform="translate(30, 465)">
        <rect width="940" height="95" fill="#FFFFFF" rx="6" stroke="#E2E8F0" stroke-width="1.2"/>
        <text x="20" y="25" font-size="12" font-weight="600" fill="#718096">探索与验证控制面板</text>
        
        <!-- 展开进度滑动条 -->
        <g transform="translate(20, 50)">
            <text x="0" y="12" font-size="12" fill="#4A5568" font-weight="500">动态展开进度 (3D → 2D)</text>
            <!-- 滑动槽 -->
            <line x1="180" y1="8" x2="480" y2="8" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
            <!-- 激活槽 -->
            <line x1="180" y1="8" x2="360" y2="8" stroke="#3182CE" stroke-width="6" stroke-linecap="round"/>
            <!-- 滑块 -->
            <circle cx="360" cy="8" r="10" fill="#FFFFFF" stroke="#3182CE" stroke-width="2.5" style="cursor: pointer;"/>
            <text x="500" y="13" font-size="12" fill="#3182CE" font-weight="600">60% (翻折中)</text>
        </g>

        <!-- 动点 E, F 位置调整 -->
        <g transform="translate(600, 50)">
            <text x="0" y="12" font-size="12" fill="#4A5568" font-weight="500">动点偏离度 (验证两点之间直线最短)</text>
            <line x1="220" y1="8" x2="370" y2="8" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
            <!-- 刚好处于最值点 0 偏离 -->
            <circle cx="295" cy="8" r="10" fill="#FFFFFF" stroke="#E53E3E" stroke-width="2.5" style="cursor: pointer;"/>
            <text x="295" y="-8" font-size="10" fill="#E53E3E" text-anchor="middle" font-weight="600">最值点(共线)</text>
        </g>
    </g>
</svg>
